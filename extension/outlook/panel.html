<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Canvian · Tareas del hilo</title>
  <link rel="stylesheet" href="../lib/theme.css" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div id="frame">
    <button class="cp-launch" hidden>
      <span class="cx-dot"></span><span class="cp-lbl">Tareas</span><span class="cp-count" hidden></span>
    </button>

    <section class="cp-panel" hidden>
      <header>
        <div class="cp-head">
          <div class="cp-kicker"><span class="cx-dot"></span>Canvian · tareas del hilo</div>
          <div class="cp-subject cx-brand"></div>
        </div>
        <button class="cx-quiet cp-x" title="Cerrar" aria-label="Cerrar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="cp-msg" hidden></div>
      <ul class="cp-tasks"></ul>

      <form class="cp-add">
        <input class="cx-field cp-text" placeholder="Nueva tarea para este hilo…" maxlength="1000" />
        <div class="cp-row">
          <input class="cx-field cp-due" type="date" title="Fecha" />
          <select class="cx-field cp-prio" title="Prioridad">
            <option value="none">Sin prioridad</option>
            <option value="high">Alta</option>
            <option value="medium">Media</option>
            <option value="low">Baja</option>
          </select>
          <button class="btn btn-primary btn-sm cp-add-btn" type="submit">Añadir</button>
        </div>
        <label class="cp-where"><span>En</span><select class="cx-field cp-note"></select></label>
      </form>

      <div class="cp-link">
        <button class="cx-quiet cp-toggle-link" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
          Vincular una tarea que ya existe
        </button>
        <div class="cp-search" hidden>
          <input class="cx-field cp-q" placeholder="Buscar en tus tareas…" />
          <ul class="cp-results"></ul>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="panel.js"></script>
</body>
</html>
