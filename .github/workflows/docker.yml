name: Docker
on:
  push:
    branches: [main]
    tags: ['v*']
  # Solo main (y las versiones): en las demás ramas y en los PR no se construye.
  workflow_dispatch:
permissions:
  contents: read
  packages: write
# Una imagen de main detrás de otra: si dos se construyen a la vez, la más
# antigua puede terminar la última y dejar «latest» apuntando a ella.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/canvian
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Solo x86: la de arm64 se emula y gasta muchos minutos de Actions.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # La caché es una ayuda: si GitHub no deja escribirla, la imagen se
          # construye igual y el paso no falla.
          cache-to: type=gha,mode=max,ignore-error=true
