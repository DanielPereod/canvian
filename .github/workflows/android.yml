name: Android
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
      - run: cp android/app/build/outputs/apk/release/app-release.apk canvian.apk
      - uses: actions/upload-artifact@v4
        with:
          name: canvian-apk
          path: mobile/canvian.apk
      # En main el APK se publica siempre en la misma dirección, para
      # descargarlo desde el móvil sin iniciar sesión en GitHub:
      # https://github.com/<dueño>/canvian/releases/download/android/canvian.apk
      - if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --cleanup-tag --yes || true
          gh release create android canvian.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "App de Android" \
            --notes "Instala canvian.apk en el móvil (permite instalar apps de origen desconocido). Cada versión se instala encima de la anterior."
