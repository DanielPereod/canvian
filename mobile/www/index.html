<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030405" />
    <title>Canvian</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #030405;
        --fg: #f2f2f2;
        --dim: #8a8d91;
        --line: #26282b;
        --bad: #ff8a80;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
      body {
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      }
      main { width: 100%; max-width: 360px; display: grid; gap: 20px; }
      img { width: 44px; height: 44px; }
      h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--dim); font-size: 14px; }
      form { display: grid; gap: 12px; }
      input {
        width: 100%;
        font: inherit;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        outline: none;
      }
      input:focus { border-color: var(--dim); }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        background: #fff;
        color: #000;
      }
      button:disabled { opacity: 0.5; }
      .error { color: var(--bad); min-height: 1.5em; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.svg" alt="" />
      <div id="busy" hidden><p id="busy-text"></p></div>
      <form id="form" hidden>
        <h1 id="title"></h1>
        <p id="hint"></p>
        <input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" required />
        <button id="go" type="submit"></button>
        <p class="error" id="error" role="alert"></p>
      </form>
    </main>
    <script>
      // Pantalla de arranque de la app: aquí solo se elige el servidor. La
      // web que se abre después es la del servidor, la misma que en el
      // navegador, así que lo que se despliega llega a la vez a los dos.
      const en = (navigator.language || '').toLowerCase().startsWith('en');
      const T = en
        ? {
            title: 'Your Canvian server',
            hint: 'The address you open Canvian at in the browser.',
            go: 'Connect',
            connecting: 'Connecting to',
            bad: 'That does not look like an address.',
            down: 'Could not reach that server. Check the address and that you are on its network.',
          }
        : {
            title: 'Tu servidor de Canvian',
            hint: 'La dirección con la que abres Canvian en el navegador.',
            go: 'Conectar',
            connecting: 'Conectando con',
            bad: 'Eso no parece una dirección.',
            down: 'No se ha podido llegar a ese servidor. Revisa la dirección y que estés en su red.',
          };
      document.documentElement.lang = en ? 'en' : 'es';
      const $ = (id) => document.getElementById(id);
      $('title').textContent = T.title;
      $('hint').textContent = T.hint;
      $('go').textContent = T.go;

      // Fuera de la app (probando en un navegador) se guarda en localStorage.
      const cap = window.Capacitor;
      const native = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
      const store = {
        async get() {
          if (native) return (await cap.nativePromise('Server', 'get', {})).url || null;
          return localStorage.getItem('canvian:server');
        },
        async set(url) {
          if (native) return cap.nativePromise('Server', 'set', { url });
          localStorage.setItem('canvian:server', url);
        },
      };

      // «canvian.casa.org» → https://…; «192.168.0.100:3210» → http://…
      function normalize(raw) {
        let s = raw.trim().replace(/\/+$/, '');
        if (!s) return null;
        if (!/^https?:\/\//i.test(s)) {
          const host = s.split(/[/:]/)[0];
          const local = host === 'localhost' || /^\d+\.\d+\.\d+\.\d+$/.test(host) || host.endsWith('.local');
          s = (local ? 'http://' : 'https://') + s;
        }
        try {
          const u = new URL(s);
          return u.origin + u.pathname.replace(/\/+$/, '');
        } catch {
          return null;
        }
      }

      async function reachable(url) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 8000);
        try {
          await fetch(url + '/health', { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
          return true;
        } catch {
          return false;
        } finally {
          clearTimeout(timer);
        }
      }

      function showForm(url, error) {
        $('busy').hidden = true;
        $('form').hidden = false;
        $('go').disabled = false;
        if (url) $('url').value = url;
        $('error').textContent = error || '';
      }

      async function open(url) {
        $('form').hidden = true;
        $('busy').hidden = false;
        $('busy-text').textContent = T.connecting + ' ' + new URL(url).host + '…';
        if (!(await reachable(url))) return showForm(url, T.down);
        await store.set(url);
        location.replace(url + '/');
      }

      $('form').addEventListener('submit', (e) => {
        e.preventDefault();
        const url = normalize($('url').value);
        if (!url) return showForm(null, T.bad);
        $('go').disabled = true;
        open(url);
      });

      (async () => {
        const saved = await store.get().catch(() => null);
        // Desde Configuración › General › Servidor se vuelve aquí con ?cambiar.
        if (!saved || new URLSearchParams(location.search).has('cambiar')) return showForm(saved);
        open(saved);
      })();
    </script>
  </body>
</html>
